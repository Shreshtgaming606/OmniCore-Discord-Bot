[package]
name = "omnicore_bot"
version = "1.0.0"
edition = "2024"

[dependencies]
log = "0.4.33"
log4rs = "1.4.0"
mongodb = { version = "3.8.0", features = ["bson-3"] }
once_cell = "1.21.4"
poise = "0.6.2"
tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde_json = "1.0.151"
chrono = "0.4.45"
futures = "0.3.33"
regex = "1.13.1"
ollama-rs = "0.3.6"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
urlencoding = "2.1.3"
aes-gcm = "0.10.3"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.9.2"
sha2 = "0.10.9"
zeroize = "1.8.2"
axum = "0.8.6"
