# Copy .env.example to .env and set a private token and owner ID first.
# MongoDB is reachable only by the bot on this private Compose network.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
      # OMNICORE_VOICE_MODEL_DIR: /voice-models
    depends_on:
      - mongo
    networks:
      - internal
    # Enable only when using local AI on a host running Ollama.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # volumes:
    #   - ./voice-models:/voice-models:ro

networks:
  internal:

volumes:
  mongo_data:
