# Dedicated OmniCore Discord Bot site. The host port is loopback only.
server {
    listen 8091;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'" always;
    # Prevent Cloudflare from injecting a Web Analytics beacon into public pages.
    add_header Cache-Control "public, no-transform" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # API keys are accepted only by the authenticated Rust portal. Its port is
    # reachable on the shared private Docker network and has no host mapping.
    location ^~ /connect/ {
        access_log off;
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $byok_upstream omnicore-discord-bot:8098;
        proxy_pass http://$byok_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html { internal; }
    error_page 404 /404.html;

    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Public Discord media can be replaced at the same URLs, so cache for one day.
    location ~ ^/media/omnicore-(?:ai-assistant|smart-moderation|server-tools)\.png$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|woff2|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
}
